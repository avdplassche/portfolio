<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Avdplassche | Contact</title>
	<script src="https://cdn.tailwindcss.com"></script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@900&display=swap" rel="stylesheet">

	<style>
		:root {
			--bg-color: #0f1117;
			--color-text: #F0F0F0;
			--color-accent: #06B6D4;
			--accent-color: #06B6D4;
			--nav-bg: #161b22;
		}

		body {
			/*font-family: 'IBM Plex Mono', monospace;*/
			font-family: 'JetBrains Mono', monospace;
			background-size: cover;
			background-position: center center;
			background-repeat: no-repeat;
			background-attachment: fixed;
			align-items: center;
			background-color: var(--bg-color);
			color: var(--color-text);
			scroll-behavior: smooth;
		}
		nav {
			font-family: 'JetBrains Mono', monospace;
		}
		.nav-link {
			transition: color 0.2s ease;
			text-decoration: none;
		}

		.nav-link:hover {
			color: var(--accent-color);
		}

		.active-nav {
			color: var(--accent-color);
		}

		.nav-link.active {
			color: var(--color-accent);
		}
		.info-rectangle {
			padding: 2.5rem;
			transition: all 0.3s ease-in-out;
			background-color: var(--nav-bg);
			border-radius: 0.5rem;
			position: relative;
		}

		.hero-title {
			font-family: 'Montserrat', sans-serif;
		}
		@media (max-width: 600px) {
			body {
				background-image: url(/images/background_gradient_07_smartphone.png);
			}
		}
	</style>
</head>
<body class="min-h-screen">
	<nav class="w-full bg-[#161b22] border-b border-[#30363d] py-4 sm:py-6 sticky top-0 z-50 px-2">
		<div class="flex justify-center items-center gap-2 sm:gap-6 text-[15px] sm:text-[20px] font-medium tracking-wide">

			<span class="text-[#30363d] text-base sm:text-lg">/</span>
			<a href="/work" class="nav-link text-white/80 hover:text-white">work</a>

		<p>&copy; 2026 Alexandre Van Der Plassche</p>
	</footer>
</body>
</html>
