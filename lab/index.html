<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Avdplassche | LAB</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@900&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg-color: #0f1117;
			--nav-bg: #161b22;
			--border-color: #30363d;
			--accent-color: #06B6D4;
			--text-main: #c9d1d9;
			--text-muted: #8b949e;
		}

		body {
			background-color: var(--bg-color);
			/* background-size: cover;
			background-position: center center;
			background-repeat: no-repeat;
			background-attachment: fixed;
			background-image: url(/images/background_gradient_11.jpg); */
			color: var(--text-main);
			font-family: 'JetBrains Mono', monospace;
			margin: 0;
			padding: 0;
		}

		.hero-title {
			font-family: 'Montserrat';
			color:#E0E0E0;
			text-shadow: 0 0 4px rgba(200, 200, 200, 0.2), 0 0 6px rgba(200, 200, 200, 0.1);
		}

		/* Container constrained to ~90% */
		.content-container {
			width: 90%;
			margin-left: auto;
			margin-right: auto;
			max-width: 1400px;
		}

		.nav-link {
			transition: color 0.2s ease;
			text-decoration: none;
		}

		.nav-link:hover {
			color: var(--accent-color);
		}

		.active-nav {
			color: var(--accent-color);
		}

		.tag {
			font-size: 11px;
			padding: 4px 10px;
			border: 1px solid var(--border-color);
			color: var(--accent-color);
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.video-label {
			position: absolute;
			top: 15px;
			right: 15px;
			background: #000;
			border: 1px solid var(--accent-color);
			color: var(--accent-color);
			padding: 2px 6px;
			font-size: 10px;
			font-weight: bold;
			z-index: 10;
		}

		.project-card {
			border: 1px solid var(--border-color);
			margin-bottom: 2rem;
			display: flex;
			overflow: hidden;
			/* background: #0d1117; */
		}

		.project-image-container {
			width: 50%;
			position: relative;
			border-right: 1px solid var(--border-color);
			aspect-ratio: 16 / 10;
		}

		.project-info {
			width: 50%;
			padding: 2rem;
			display: flex;
			flex-direction: column;
		}

		@media (max-width: 768px) {
			.project-card {
				flex-direction: column;
			}
			.project-image-container, .project-info {
				width: 100%;
			}
			.project-image-container {
				border-right: none;
				border-bottom: 1px solid var(--border-color);
			}
		}
	</style>
</head>
<body class="min-h-screen">

	<nav class="w-full bg-[#161b22] border-b border-[#30363d] py-6 sticky top-0 z-50">
		<div class="flex justify-center items-center gap-6 text-[14px] font-medium tracking-wide">
			<a href="/" class="nav-link text-white opacity-80">about me</a>
			<span class="text-[#30363d] text-lg">/</span>
			<a href="/work" class="nav-link text-white opacity-80">work</a>
			<span class="text-[#30363d] text-lg">/</span>
			<a href="#" class="nav-link active-nav">lab</a>
			<span class="text-[#30363d] text-lg">/</span>
			<a href="/contact" class="nav-link text-white opacity-80">contact</a>
		</div>
	</nav>

	<div class="content-container">
		<header class="py-16">
			<h1 class="text-6xl sm:text-8xl font-extrabold hero-title ">LAB</h1>
			<div class="flex flex-wrap gap-4 text-xs tracking-[0.2em] text-[#8b949e] uppercase">
				<span>GRAPHICAL EXPERIMENTS</span>
			</div>
		</header>

		<main class="pb-20">

			<div class="project-card">
				<div class="project-info justify-center">
					<div class=" justify-center">
						<h2 class="text-3xl font-bold mb-4 uppercase tracking-tighter">Obsidian</h2>
						<p class="text-[#8b949e] leading-relaxed mb-6 ">
							<a href="/lab/obsidian">See my workflow</a>
						</p>
					</div>
				</div>
				<div class="project-image-container">
					<img src="/images/obsidian_graph_view.png" alt="Graph View" class="w-full object-cover">
				</div>
			</div>

			<div class="project-card">
				<div class="project-info">
					<h2 class="text-3xl font-bold mb-4 uppercase tracking-tighter">Merge-insertion sort</h2>
					<h2 class="text-3xl font-bold mb-4 uppercase tracking-tighter">C++</h2>
						<p class="text-[#8b949e] leading-relaxed mb-6">
							Visual implementation of a Ford-Johnson style sorting algorithm with animated merge-insertion sequences.
						</p>
				</div>
				<div class="project-image-container">
					<video controls>
						<source src="/videos/merge_insertion.mp4" type="video/mp4">
					</video>
					<img src="/images/merge_sort_1.png" alt="Merge Sort 1" class="w-full object-cover">
					<img src="/images/merge_sort_2.png" alt="Merge Sort 2" class="w-full object-cover">
				</div>
			</div>

			<!-- Project 02 -->
			<div class="project-card">
				<!-- <h2 class="text-3xl font-bold mb-4 uppercase tracking-tighter">Creative Coding</h2> -->
				<div class="project-info justify-center">
					<!-- <h2 class="text-3xl font-bold mb-4 uppercase tracking-tighter">Creative Coding</h2> -->
					<p class="text-[#8b949e] leading-relaxed mb-2">
						Creative Coding
					</p>
					<p class="text-[#8b949e] leading-relaxed mb-2">
						C / C++
					</p>
				</div>
				<div class="project-image-container">
					<video controls>
						<source src="/videos/gol.mov" type="video/mp4">
					</video>
					 <video controls>
						<source src="/videos/physic_sim.mov" type="video/mp4">
					</video>
					<video controls>
						<source src="/videos/tree.mov" type="video/mp4">
					</video>

				</div>
			</div>



		</main>
	</div>

	<!-- Simple Footer -->
	<footer class="mt-20 py-6 border-t border-gray-700 text-center text-sm text-gray-300">
		<p>&copy; 2026 Alexandre Van Der Plassche</p>
	</footer>

</body>
</html>
